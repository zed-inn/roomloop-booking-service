[project]
name = "roomloop"
version = "0.1.0"
description = "Booking system to book rooms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomloop"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
]
